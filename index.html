<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore our courses | IMT-BS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Zilla+Slab:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Scène de base 1280 x 720 (16:9), mise à l'échelle et étirée pour remplir tout le cadre, comme un Genially */
:root{
  --violet:#AD1D89; --violet-fonce:#8A176D; --bleu:#00B8DE; --noir:#000; --blanc:#fff;
  --violet-10:#F7E8F3; --violet-20:#E7D2E2; --gris:rgba(0,0,0,.62);
  --sans:"Helvetica Neue LT Std","Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
  --serif:Archer,"Zilla Slab",Rockwell,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#000}
body{font-family:var(--sans);line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit}
#scene{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;padding:20px 32px 12px}

/* ---------- Bandeau ---------- */
.bandeau{position:relative;display:flex;align-items:center;gap:20px;height:66px;flex:none}
.bandeau img{height:58px;width:auto;flex:none}
.titres{flex:1;min-width:0}
h1{margin:0;text-transform:uppercase;line-height:1;font-size:31px;letter-spacing:-.005em;white-space:nowrap}
h1 .serif{font-family:var(--serif);font-weight:300;color:var(--violet)}
h1 .accent{font-weight:700;color:var(--bleu)}
.chapo{margin:6px 0 0;font-size:14px;color:var(--gris);white-space:nowrap}
.commandes{display:flex;align-items:center;gap:14px;flex:none}
.groupe{display:flex;gap:4px}
.puce,.langues button,.ecran-plein{border:1.5px solid var(--violet);background:#fff;color:var(--violet);height:30px;padding:0 10px;font-size:13px;font-weight:700;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;text-decoration:none}
.puce[aria-pressed="true"],.langues button[aria-pressed="true"]{background:var(--violet);color:#fff}
.puce:hover{background:var(--violet-10)}
.puce[aria-pressed="true"]:hover{background:var(--violet-fonce)}
.langues{display:flex}
.langues button+button{border-left:0}
.ecran-plein{padding:0 7px}
.ecran-plein svg{width:15px;height:15px}
.sep{width:1px;height:26px;background:var(--violet-20)}
.filets{position:absolute;left:540px;top:-24px;width:110px;height:110px;pointer-events:none;
  background:
    linear-gradient(135deg,transparent calc(46% - 1px),var(--violet) calc(46% - 1px),var(--violet) calc(46% + 1px),transparent calc(46% + 1px)),
    linear-gradient(135deg,transparent calc(60% - .6px),var(--bleu) calc(60% - .6px),var(--bleu) calc(60% + .6px),transparent calc(60% + .6px));opacity:0}

/* ---------- Grille 4 x 4 ---------- */
.grille{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:14px;margin:14px 0 0;padding:0;list-style:none;min-height:0}
.cours{display:flex;border:1.5px solid var(--violet);background:#fff;min-width:0;min-height:0;transition:border-color .2s,box-shadow .2s}
.cours:hover{border-color:var(--bleu);box-shadow:inset 0 0 0 1.5px var(--bleu)}
.cours[hidden]{display:none}
.vignette{position:relative;flex:none;width:112px;height:100%;padding:0;border:0;border-right:1.5px solid var(--violet-20);background:#fff;cursor:pointer;overflow:hidden}
.vignette img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .35s ease}
.cours:hover .vignette img{transform:scale(1.06)}
.vignette .lire{position:absolute;left:6px;bottom:6px;display:flex}
.vignette .lire i{display:grid;place-items:center;width:26px;height:26px;background:var(--violet);transition:background .2s}
.vignette .lire i::before{content:"";margin-left:2px;border-left:8px solid #fff;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.vignette .lire b{display:grid;place-items:center;height:26px;padding:0 5px;background:#fff;border:1px solid var(--violet-10);border-left:0;font-size:11px;font-weight:700}
.vignette:hover .lire i{background:var(--bleu)}
.corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 10px 9px}
.code{margin:0;color:var(--violet);font-weight:700;font-size:12px;letter-spacing:.06em}
.cours h3{margin:0;font-size:15.5px;line-height:1.18;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:4px;margin:0;font-size:11px;min-width:0}
.meta .niveau{background:var(--violet);color:#fff;font-weight:700;padding:1px 5px;flex:none}
.meta .langue{background:var(--violet-10);padding:1px 5px;flex:none}
.meta .prof{color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;border:1.5px solid var(--violet);background:var(--violet);color:#fff;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer;border-radius:0;white-space:nowrap}
.btn:hover{background:var(--violet-fonce);border-color:var(--violet-fonce)}
.btn.secondaire{background:#fff;color:var(--violet)}
.btn.secondaire:hover{background:var(--violet-10)}
.btn svg{width:10px;height:10px;flex:none}
:is(.puce,.langues button,.ecran-plein,.btn,.vignette,.fermer):focus-visible{outline:3px solid var(--bleu);outline-offset:2px}

/* ---------- Pied ---------- */
.pied{display:flex;justify-content:space-between;gap:8px;padding-top:9px;flex:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.pied b{color:var(--violet)}
.pied span:last-child{color:var(--violet);font-weight:700}

/* ---------- Lecteur vidéo, centré dans la scène ---------- */
.voile{position:absolute;inset:0;background:rgba(0,0,0,.74);z-index:10;display:none;align-items:center;justify-content:center}
.voile.ouvert{display:flex}
.lecteur{width:960px;background:#fff;border-top:4px solid var(--violet)}
.lecteur header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
.lecteur header p{margin:0;font-weight:700;font-size:17px}
.lecteur header p small{display:block;color:var(--violet);font-size:12px;letter-spacing:.06em}
.fermer{border:1.5px solid var(--violet);background:#fff;color:var(--violet);width:34px;height:34px;cursor:pointer;font-size:20px;line-height:1}
.fermer:hover{background:var(--violet-10)}
.ecran{position:relative;width:100%;height:540px;background:#000}
.ecran iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lecteur footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px}
.lecteur footer .btn{height:32px;padding:0 14px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  en:{titre1:"Explore our courses", titre2:"in two minutes",
      chapo:"16 courses from L3 to M2: watch the video presentation, then go straight to the Moodle space.",
      tous:"All", video:"Video", cours:"Course", acces:"Go to the course", ouvrirMedia:"Open in MediaServer",

  fr:{titre1:"Découvrez nos cours", titre2:"en deux minutes",
      chapo:"16 cours de la L3 au M2 : regardez la vidéo de présentation, puis accédez directement à l'espace Moodle.",

let langue = "en", niveau = "";
const $ = s => document.querySelector(s);
const echap = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fleche = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const triangle = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';

/* Mise à l'échelle de la scène : remplit la largeur du cadre, centrée si le cadre n'est pas en 16:9 */
function ajuster(){
  /* La scène occupe tout le cadre : échelle sur le côté limitant, l'autre côté s'étire (aucune bande blanche) */
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  const sc = $("#scene");
  sc.style.width = (innerWidth / s) + "px";
  sc.style.height = (innerHeight / s) + "px";
  sc.style.transform = `scale(${s})`;
}
addEventListener("resize", ajuster);

function rendre(){
  const t = TXT[langue];
  $("#grille").innerHTML = COURS.map((c,i) => `<li class="cours" data-i="${i}"${niveau && c.niveau !== niveau ? " hidden" : ""}>
      <button class="vignette" type="button" data-video="${i}" aria-label="${t.lire} ${echap(c.titre)} (${c.duree})">
        <img src="${IMAGES[c.code.replace(" ","_")]}" alt="">
        <span class="lire"><i></i><b>${c.duree}</b></span>
      </button>
      <div class="corps">
        <p class="code">${c.code}</p>
        <h3 title="${echap(c.titre)}">${echap(c.titre)}</h3>
        <p class="meta"><span class="niveau">${c.niveau}</span>${c.langue ? `<span class="langue">${c.langue}</span>` : ""}<span class="prof" title="${echap(c.prof)}">${echap(c.prof)}</span></p>
        <div class="actions">
          <button class="btn" type="button" data-video="${i}">${triangle}${t.video}</button>
          <a class="btn secondaire" href="${MOODLE + c.moodle}" target="_blank" rel="noopener" aria-label="${t.acces} ${echap(c.titre)}">${t.cours} ${fleche}</a>
        </div>
      </div>
    </li>`).join("");
}

function traduire(l){
  langue = l;
  document.documentElement.lang = l;
  const t = TXT[l];
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = t[el.dataset.i18n]; if (v) el.textContent = v; });
  document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.langBtn === l));
  $("#fermer").setAttribute("aria-label", t.fermer);
  const plein = $("#plein"); plein.title = t.plein; plein.setAttribute("aria-label", t.plein);
  plein.href = "./" + (l === "fr" ? "?lang=fr" : "");
  rendre();
}

let dernierFocus = null;
function ouvrir(i, origine){
  const c = COURS[i];
  dernierFocus = origine;
  $("#lecteur-titre").innerHTML = `<small>${c.code} · ${c.niveau}</small>${echap(c.titre)}`;
  $("#ecran").src = MEDIA + c.video + "/iframe/";
  $("#lien-media").href = MEDIA + c.video + "/";
  $("#lien-moodle").href = MOODLE + c.moodle;
  $("#voile").classList.add("ouvert");
  $("#fermer").focus({preventScroll:true});
}
function fermer(){
  $("#voile").classList.remove("ouvert");
  $("#ecran").src = "about:blank";
  if (dernierFocus) dernierFocus.focus({preventScroll:true});
}

document.addEventListener("click", e => {
  const v = e.target.closest("[data-video]");
  if (v) { ouvrir(+v.dataset.video, v); return; }
  const f = e.target.closest("[data-filtre]");
  if (f) {
    niveau = f.dataset.valeur;
    document.querySelectorAll("[data-filtre]").forEach(b => b.setAttribute("aria-pressed", b === f));
    document.querySelectorAll(".cours").forEach(li => li.hidden = !!niveau && COURS[+li.dataset.i].niveau !== niveau);
    return;
  }
  const l = e.target.closest("[data-lang-btn]");
  if (l) { traduire(l.dataset.langBtn); return; }
  if (e.target.id === "voile" || e.target.closest("#fermer")) fermer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#voile").classList.contains("ouvert")) fermer(); });

const p = new URLSearchParams(location.search).get("lang");
traduire(p === "fr" ? "fr" : "en");
ajuster();
</script>
